<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 240" width="920" height="240" role="img" aria-label="SlimeChem">
  <defs>
    <linearGradient id="g" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#7c3aed"><animate attributeName="stop-color" values="#7c3aed;#22d3ee;#7c3aed" dur="8s" repeatCount="indefinite"/></stop>
      <stop offset="100%" stop-color="#22d3ee"><animate attributeName="stop-color" values="#22d3ee;#7c3aed;#22d3ee" dur="8s" repeatCount="indefinite"/></stop>
    </linearGradient>
  </defs>
  <rect width="920" height="240" rx="18" fill="#0b1020"/>
  <rect width="920" height="240" rx="18" fill="url(#g)" opacity="0.16"/>
  <g fill="none" stroke="url(#g)" stroke-width="2" opacity="0.5">
    <circle cx="820" cy="60" r="26"><animate attributeName="r" values="26;32;26" dur="5s" repeatCount="indefinite"/></circle>
    <circle cx="90" cy="190" r="18"><animate attributeName="r" values="18;24;18" dur="6s" repeatCount="indefinite"/></circle>
  </g>
  <text x="52" y="118" font-family="Segoe UI,Roboto,sans-serif" font-size="46" font-weight="800" fill="#e8ecff">SlimeChem</text>
  <text x="54" y="158" font-family="Segoe UI,Roboto,sans-serif" font-size="19" fill="#9fb0d9">Addon de Slimefun · DrakesCraft</text>
  <rect x="52" y="182" width="0" height="5" rx="2" fill="url(#g)">
    <animate attributeName="width" values="0;300;0" dur="7s" repeatCount="indefinite"/>
  </rect>
</svg>
